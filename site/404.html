<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到这个页面 · MarketPilot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2212%22 fill=%22%23D4FF3A%22 stroke=%22%23111827%22 stroke-width=%227%22/%3E%3C/svg%3E">
<!-- 这一页会出现在任意深度的错误地址上，所以样式全部内联、不引用相对路径的文件；
     链接用根路径（/），对应 Cloudflare Pages 部署在域名根目录的情况。令牌与 assets/site.css、shell.css 相同。 -->
<style>
:root{--bg:#F2F4F7;--card:#FFFFFF;--ink:#111827;--ink2:#5F6878;--line:#E3E6EC;--lime:#D4FF3A;--vio:#7A5CFF;--dark:#0D0E10;
  --sans:"Schibsted Grotesk","Noto Sans SC",sans-serif;--zh:"Noto Sans SC","Microsoft YaHei",sans-serif;--serif:"Noto Serif SC","Songti SC",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.85 var(--zh);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
.w{max-width:1220px;margin:0 auto;padding:0 32px}
header.top .w{display:flex;align-items:center;height:68px}
.logo{font:900 20px var(--sans);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.logo i{width:20px;height:20px;border-radius:50%;border:5px solid var(--ink);background:var(--lime)}
main{padding-bottom:64px}
.nf{margin-top:16px;padding:64px 56px 70px;background:var(--dark);color:#fff;border-radius:24px}
.lab{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#C9CDD3}
h1{font:900 clamp(40px,6vw,72px)/1.15 var(--serif);margin:14px 0 0}
p{font:500 18px/1.75 var(--zh);color:#E3E6EA;margin:20px 0 0;max-width:30em}
.go{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;font:700 14px var(--zh);border-radius:999px;padding:11px 20px;background:#fff;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--ink);color:var(--lime);box-shadow:inset 0 0 0 1px #2A2D32}
.btn:hover{background:var(--lime);color:var(--ink)}
@media (max-width:760px){.w{padding:0 16px}header.top .w{height:60px}.logo{font-size:17px}.logo i{width:16px;height:16px;border-width:4px}
  .nf{padding:40px 24px 46px}p{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="w"><a class="logo" href="/"><i></i>MarketPilot</a></div></header>
<main class="w">
  <section class="nf" aria-labelledby="nf-h">
    <span class="lab">404</span>
    <h1 id="nf-h">找不到这个页面</h1>
    <p>地址可能输错了，或者这个页面已经不在这里。</p>
    <div class="go"><a class="btn pri" href="/">回到首页</a><a class="btn" href="/#courses">浏览课程目录</a></div>
  </section>
</main>
</body>
</html>
